[package]
name = "app"
version = "2.0.0"
description = "Hikari Server Launcher desktop client"
authors = ["Hikari Revival Project"]
license = "GPL-3.0-only"
repository = "https://github.com/HikariRevivalProject/HikariServerLauncher"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
ureq = "2"
base64 = "0.22"
url = "2"
rfd = "0.15"
