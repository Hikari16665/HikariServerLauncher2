name: "Bug Report"
description: "报告一个 Bug / Report a bug"
title: "[Bug] "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "Clearly describe the issue you encountered."
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "List the exact steps to trigger this bug."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened? Include error messages or screenshots."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Python version, Java version, etc."
    validations:
      required: false
  - type: checkboxes
    id: sanity
    attributes:
      label: "Pre-submission Checklist"
      options:
        - label: "I confirm this is not an AI-generated hallucination report; the steps above can be reproduced by a human"
          required: true
