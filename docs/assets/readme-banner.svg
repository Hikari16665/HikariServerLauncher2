<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="88" viewBox="0 0 1200 88" role="img" aria-labelledby="title desc">
  <title id="title">HSL2 decorative divider</title>
  <desc id="desc">A slim geometric divider inspired by the HSL2 mark.</desc>
  <defs>
    <linearGradient id="line-left" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d44a7a" stop-opacity="0"/>
      <stop offset="1" stop-color="#d44a7a" stop-opacity=".72"/>
    </linearGradient>
    <linearGradient id="line-right" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8d62df" stop-opacity=".72"/>
      <stop offset="1" stop-color="#8d62df" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d44a7a"/>
      <stop offset="1" stop-color="#8d62df"/>
    </linearGradient>
  </defs>

  <path d="M48 44H548" fill="none" stroke="url(#line-left)" stroke-width="1.5"/>
  <path d="M652 44H1152" fill="none" stroke="url(#line-right)" stroke-width="1.5"/>

  <g transform="translate(600 44) rotate(45)">
    <rect x="-25" y="-25" width="50" height="50" rx="10" fill="none" stroke="url(#mark)" stroke-width="2"/>
    <rect x="-13" y="-13" width="26" height="26" rx="5" fill="url(#mark)" opacity=".14"/>
    <path d="M-13-3H13M-3-13V13" stroke="url(#mark)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <circle cx="548" cy="44" r="3" fill="#d44a7a"/>
  <circle cx="652" cy="44" r="3" fill="#8d62df"/>
</svg>
